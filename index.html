<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cole Bailey</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="modal.css" />
  </head>

  <body>
    <canvas id="bg"></canvas>

    <div class="ui">
      <button class="name" data-modal="about" id="open">Cole Bailey</button>

      <nav class="nav" aria-label="Primary">
        <button data-modal="work">Work</button>
        <button data-modal="projects">Projects</button>
        <button data-modal="clients">Clients</button>
        <button data-modal="tools">Tools</button>
      </nav>

      <button class="contact" data-modal="contact">
        <span class="dot"></span>Contact
      </button>

      <p class="meta">© 2026 — Available for work</p>
    </div>

    <div class="modal-container" id="modal-container">
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <button class="modal-close" id="modal-close" aria-label="Close">
          x
        </button>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <script type="module" src="./src/assets/js/main.js"></script>
    <script type="module" src="./src/assets/js/menu/modal.js"></script>
  </body>
</html>
